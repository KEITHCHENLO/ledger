<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>記帳本</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111314" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="記帳本" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111314; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
    .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 90px; min-height: 100vh; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 20px; }
    .header h1 { font-size: 20px; font-weight: 600; color: #f0ede8; }
    .month-nav { display: flex; align-items: center; gap: 10px; }
    .month-nav button { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; padding: 4px 8px; }
    .month-nav span { font-size: 13px; color: #aaa; min-width: 72px; text-align: center; }
    .summary-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .sum-card { background: #1c1f22; border-radius: 12px; padding: 12px 10px; }
    .sum-card .lbl { font-size: 11px; color: #666; margin-bottom: 4px; }
    .sum-card .amt { font-size: 14px; font-weight: 600; color: #f0ede8; }
    .sum-card .amt.inc { color: #4cc98a; }
    .sum-card .amt.inv { color: #6aa8f5; }
    .chart-wrap { background: #1c1f22; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
    .chart-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .chart-title { font-size: 12px; color: #666; letter-spacing: 0.04em; }
    .chart-hint { font-size: 10px; color: #3a3d40; }
    .bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 80px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .bar { width: 100%; border-radius: 4px 4px 0 0; transition: all 0.2s; }
    .bar-col:hover .bar { opacity: 0.75; }
    .bar-lbl { font-size: 10px; color: #555; transition: color 0.2s; }
    .bar-col.active .bar-lbl { color: #e06c6c; }
    .tab-row { display: flex; background: #1c1f22; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: none; border-radius: 9px; font-size: 13px; color: #666; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .tab-btn.active { background: #2a2d30; color: #f0ede8; }
    .cat-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .cat-chip { padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid transparent; }
    .section-label { font-size: 11px; color: #555; letter-spacing: 0.06em; margin-bottom: 10px; }
    .tx-item { display: flex; align-items: center; gap: 12px; padding: 12px 10px; background: #1c1f22; border-radius: 10px; margin-bottom: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .tx-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .tx-info { flex: 1; min-width: 0; }
    .tx-name { font-size: 14px; color: #d8d4cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 11px; color: #555; margin-top: 2px; }
    .tx-amount { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .tx-amount.neg { color: #e06c6c; }
    .tx-amount.pos { color: #4cc98a; }
    .tx-amount.iv { color: #6aa8f5; }
    .empty { text-align: center; color: #444; font-size: 13px; padding: 40px 0; }
    .analysis { display: none; }
    .analysis.visible { display: block; }
    .home-view.hidden { display: none; }
    .anal-section { background: #1c1f22; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .anal-title { font-size: 12px; color: #666; margin-bottom: 14px; letter-spacing: 0.04em; }
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-card { background: #1c1f22; border-radius: 12px; padding: 14px 12px; }
    .stat-card .lbl { font-size: 11px; color: #666; margin-bottom: 6px; }
    .stat-card .val { font-size: 18px; font-weight: 600; color: #f0ede8; }
    .stat-card .sub { font-size: 11px; color: #555; margin-top: 3px; }
    .year-bar-wrap { display: flex; align-items: flex-end; gap: 3px; height: 100px; }
    .ybar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .ybar { width: 100%; border-radius: 3px 3px 0 0; }
    .ybar-lbl { font-size: 9px; color: #555; }
    .ybar-val { font-size: 8px; color: #555; min-height: 10px; }
    .donut-wrap { display: flex; align-items: center; gap: 16px; }
    .donut-legend { flex: 1; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
    .leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .leg-bar-wrap { flex: 1; background: #2a2d30; border-radius: 4px; height: 4px; overflow: hidden; min-width: 20px; }
    .leg-bar { height: 100%; border-radius: 4px; }
    .leg-pct { font-size: 11px; color: #666; min-width: 28px; text-align: right; }
    .fab { position: fixed; bottom: 24px; right: 50%; transform: translateX(calc(50% - 16px + min(50vw, 240px) - 68px)); z-index: 50; }
    .fab button { width: 56px; height: 56px; border-radius: 50%; background: #f0ede8; border: none; font-size: 28px; color: #111; cursor: pointer; box-shadow: 0 4px 24px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
    .modal { background: #1a1d20; border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; padding: 24px 20px 40px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 16px; font-weight: 600; color: #f0ede8; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { font-size: 11px; color: #666; display: block; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; background: #111314; border: 1px solid #2a2d30; border-radius: 10px; padding: 12px; font-size: 16px; color: #f0ede8; font-family: inherit; outline: none; -webkit-appearance: none; }
    .form-group input:focus, .form-group select:focus { border-color: #444; }
    .form-group select option { background: #1a1d20; }
    .type-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .type-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #2a2d30; background: none; font-size: 14px; cursor: pointer; color: #888; font-family: inherit; }
    .type-btn.ae { background: #3a1a1a; border-color: #e06c6c; color: #e06c6c; }
    .type-btn.ai { background: #0e2d1e; border-color: #4cc98a; color: #4cc98a; }
    .type-btn.av { background: #0e1f35; border-color: #6aa8f5; color: #6aa8f5; }
    .submit-btn { width: 100%; padding: 14px; background: #f0ede8; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; color: #111; cursor: pointer; font-family: inherit; }
    .del-btn { width: 100%; padding: 12px; background: none; border: 1px solid #3a1a1a; border-radius: 10px; color: #e06c6c; font-size: 14px; cursor: pointer; margin-top: 8px; font-family: inherit; }
    .cancel-btn { width: 100%; padding: 12px; background: none; border: none; color: #555; font-size: 14px; cursor: pointer; margin-top: 4px; font-family: inherit; }
    .save-ind { font-size: 10px; color: #333; text-align: right; padding: 4px 0 8px; }
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #2a2d30; color: #f0ede8; font-size: 13px; padding: 10px 20px; border-radius: 20px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>記帳本</h1>
    <div class="month-nav" id="monthNav">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="tab-row">
    <button class="tab-btn active" onclick="switchTab('home')">明細</button>
    <button class="tab-btn" onclick="switchTab('analysis')">分析</button>
  </div>

  <div class="home-view" id="homeView">
    <div class="summary-row">
      <div class="sum-card"><div class="lbl">支出</div><div class="amt" id="totalExp">$0</div></div>
      <div class="sum-card"><div class="lbl">收入</div><div class="amt inc" id="totalInc">$0</div></div>
      <div class="sum-card"><div class="lbl">投資</div><div class="amt inv" id="totalInv">$0</div></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-top">
        <div class="chart-title">近6個月支出</div>
        <div class="chart-hint">點擊切換月份</div>
      </div>
      <div class="bar-chart" id="barChart"></div>
    </div>
    <div class="cat-row" id="catRow"></div>
    <div class="section-label">明細</div>
    <div id="txList"></div>
    <div class="save-ind" id="saveIndicator"></div>
  </div>

  <div class="analysis" id="analysisView">
    <div class="stat-row" id="statRow"></div>
    <div class="anal-section">
      <div class="anal-title">本年度各月支出</div>
      <div class="year-bar-wrap" id="yearBarChart"></div>
    </div>
    <div class="anal-section">
      <div class="anal-title" id="donutTitle">本月支出分類</div>
      <div class="donut-wrap">
        <svg id="donutSvg" width="110" height="110" viewBox="0 0 110 110" style="flex-shrink:0;"></svg>
        <div class="donut-legend" id="donutLegend"></div>
      </div>
    </div>
  </div>
</div>

<div class="fab"><button onclick="openModal(null)">+</button></div>

<div class="modal-bg" id="modalBg" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">新增一筆</h2>
    <div class="type-row">
      <button class="type-btn ae" id="typeExp" onclick="setType('exp')">支出</button>
      <button class="type-btn" id="typeInc" onclick="setType('inc')">收入</button>
      <button class="type-btn" id="typeInv" onclick="setType('inv')">投資</button>
    </div>
    <div class="form-group"><label>金額（元）</label><input type="number" id="fAmount" placeholder="0" inputmode="numeric" /></div>
    <div class="form-group"><label>分類</label><select id="fCat"></select></div>
    <div class="form-group"><label>備註</label><input type="text" id="fNote" placeholder="選填" /></div>
    <div class="form-group"><label>日期</label><input type="date" id="fDate" /></div>
    <button class="submit-btn" id="submitBtn" onclick="saveTx()">記帳</button>
    <button class="del-btn" id="delBtn" style="display:none;" onclick="deleteTx()">刪除這筆</button>
    <button class="cancel-btn" onclick="closeModal()">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {
  exp: ['餐飲','交通','購物','娛樂','醫療','家庭','水電','其他'],
  inc: ['薪資','獎金','其他收入'],
  inv: ['台股','美股','可轉債','ETF','其他投資']
};
const CAT_COLORS = {
  '餐飲':'#e06c6c','交通':'#e09a6c','購物':'#d4b86c','娛樂':'#a8c86c',
  '醫療':'#6cc8c8','家庭':'#6c9ae0','水電':'#9a6ce0','其他':'#888',
  '薪資':'#4cc98a','獎金':'#4cc9b0','其他收入':'#4c9ac9',
  '台股':'#6aa8f5','美股':'#4a88d5','可轉債':'#8a6af5','ETF':'#5ac8f5','其他投資':'#3a68c5'
};
const CAT_ICONS = {
  '餐飲':'🍜','交通':'🚗','購物':'🛍️','娛樂':'🎬','醫療':'💊','家庭':'🏠','水電':'💡','其他':'📌',
  '薪資':'💰','獎金':'🎁','其他收入':'💵',
  '台股':'📈','美股':'📊','可轉債':'📋','ETF':'🌐','其他投資':'💹'
};
const DONUT_COLORS = ['#e06c6c','#6aa8f5','#4cc98a','#d4b86c','#9a6ce0','#6cc8c8','#e09a6c','#4cc9b0','#a8c86c','#8a6af5'];
const STORAGE_KEY = 'keith_ledger_v1';

function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return { transactions: [], nextId: 1 };
}
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ transactions, nextId }));
    const n = new Date();
    document.getElementById('saveIndicator').textContent = '已儲存 ' + n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0');
  } catch(e) { showToast('儲存失敗'); }
}

let { transactions, nextId } = loadData();
let currentMonthOffset = 0;
let filterCat = 'all';
let currentType = 'exp';
let editingId = null;
let currentTab = 'home';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2000);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0&&tab==='home')||(i===1&&tab==='analysis'));
  });
  document.getElementById('homeView').classList.toggle('hidden', tab!=='home');
  document.getElementById('analysisView').classList.toggle('visible', tab==='analysis');
  document.getElementById('monthNav').style.display = tab==='home' ? 'flex' : 'none';
  if (tab==='analysis') renderAnalysis();
}

function getViewMonth() {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+currentMonthOffset); return d;
}
function changeMonth(dir) { currentMonthOffset += dir; filterCat = 'all'; render(); }
function getTxForMonth(y,m) {
  return transactions.filter(t => { const d=new Date(t.date); return d.getFullYear()===y && d.getMonth()===m; });
}
function monthTxs() { const d=getViewMonth(); return getTxForMonth(d.getFullYear(),d.getMonth()); }
function fmt(n) { return '$'+n.toLocaleString(); }

function render() {
  const d = getViewMonth();
  document.getElementById('monthLabel').textContent = (d.getMonth()+1)+'月 '+d.getFullYear();
  const txs = monthTxs();
  document.getElementById('totalExp').textContent = fmt(txs.filter(t=>t.type==='exp').reduce((a,t)=>a+t.amount,0));
  document.getElementById('totalInc').textContent = fmt(txs.filter(t=>t.type==='inc').reduce((a,t)=>a+t.amount,0));
  document.getElementById('totalInv').textContent = fmt(txs.filter(t=>t.type==='inv').reduce((a,t)=>a+t.amount,0));
  renderBarChart();
  renderCats(txs);
  renderList(txs);
}

function renderBarChart() {
  const now = new Date();
  // 6 slots: i=5 means 5 months ago (offset=-5), i=0 means current real month (offset=0)
  const slots = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    slots.push({ year: d.getFullYear(), month: d.getMonth(), label: (d.getMonth()+1)+'月', offset: -i });
  }
  const data = slots.map(s =>
    transactions.filter(t => { const td=new Date(t.date); return t.type==='exp'&&td.getFullYear()===s.year&&td.getMonth()===s.month; })
      .reduce((a,t)=>a+t.amount, 0)
  );
  const container = document.getElementById('barChart');
  container.innerHTML = '';
  const maxVal = Math.max(...data, 1);
  slots.forEach((s,i) => {
    const isActive = s.offset === currentMonthOffset;
    const col = document.createElement('div');
    col.className = 'bar-col'+(isActive?' active':'');
    col.onclick = () => { currentMonthOffset=s.offset; filterCat='all'; render(); };
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = Math.max(4, Math.round((data[i]/maxVal)*100))+'%';
    bar.style.background = isActive ? '#e06c6c' : '#2e3236';
    const lbl = document.createElement('div');
    lbl.className = 'bar-lbl';
    lbl.textContent = s.label;
    col.appendChild(bar); col.appendChild(lbl);
    container.appendChild(col);
  });
}

function renderCats(txs) {
  const allCats = [...new Set(txs.map(t=>t.cat))];
  const row = document.getElementById('catRow');
  row.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'cat-chip';
  all.textContent = '全部';
  all.style.cssText = filterCat==='all' ? 'background:#f0ede8;color:#111;border-color:#f0ede8;' : 'background:#1c1f22;color:#666;border-color:#2a2d30;';
  all.onclick = () => { filterCat='all'; render(); };
  row.appendChild(all);
  allCats.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'cat-chip';
    const color = CAT_COLORS[cat]||'#888';
    chip.style.cssText = filterCat===cat ? `background:${color}22;color:${color};border-color:${color};` : 'background:#1c1f22;color:#666;border-color:#2a2d30;';
    chip.textContent = (CAT_ICONS[cat]||'')+' '+cat;
    chip.onclick = () => { filterCat=cat; render(); };
    row.appendChild(chip);
  });
}

function renderList(txs) {
  const filtered = filterCat==='all' ? txs : txs.filter(t=>t.cat===filterCat);
  const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const list = document.getElementById('txList');
  list.innerHTML = '';
  if (!sorted.length) { list.innerHTML='<div class="empty">這個月還沒有紀錄</div>'; return; }
  sorted.forEach(t => {
    const item = document.createElement('div');
    item.className = 'tx-item';
    const color = CAT_COLORS[t.cat]||'#888';
    const amtClass = t.type==='exp'?'neg':t.type==='inc'?'pos':'iv';
    const sign = t.type==='exp'?'-':'+';
    const d = new Date(t.date);
    item.innerHTML = `
      <div class="tx-icon" style="background:${color}18;">${CAT_ICONS[t.cat]||'💸'}</div>
      <div class="tx-info">
        <div class="tx-name">${t.note||t.cat}</div>
        <div class="tx-meta">${t.cat} · ${d.getMonth()+1}/${d.getDate()}</div>
      </div>
      <div class="tx-amount ${amtClass}">${sign}${t.amount.toLocaleString()}</div>
    `;
    item.onclick = () => openModal(t.id);
    list.appendChild(item);
  });
}

function renderAnalysis() {
  const now = new Date();
  const thisYear = now.getFullYear();
  const thisMonth = now.getMonth();
  const allExp = transactions.filter(t=>t.type==='exp');

  const getMonthExp = (y,m) => allExp.filter(t=>{ const d=new Date(t.date); return d.getFullYear()===y&&d.getMonth()===m; }).reduce((a,t)=>a+t.amount,0);
  const thisMonthExp = getMonthExp(thisYear, thisMonth);
  const lm = new Date(thisYear, thisMonth-1, 1);
  const lastMonthExp = getMonthExp(lm.getFullYear(), lm.getMonth());
  const ytdExp = allExp.filter(t=>new Date(t.date).getFullYear()===thisYear).reduce((a,t)=>a+t.amount,0);
  const monthsWithData = Math.max(1, [...new Set(allExp.filter(t=>new Date(t.date).getFullYear()===thisYear).map(t=>new Date(t.date).getMonth()))].length);
  const avgExp = Math.round(ytdExp/monthsWithData);
  const diff = thisMonthExp - lastMonthExp;
  const diffStr = (diff>=0?'+':'')+fmt(diff);
  const diffColor = diff<=0 ? '#4cc98a' : '#e06c6c';

  document.getElementById('statRow').innerHTML = `
    <div class="stat-card"><div class="lbl">本月支出</div><div class="val">${fmt(thisMonthExp)}</div><div class="sub" style="color:${diffColor}">較上月 ${diffStr}</div></div>
    <div class="stat-card"><div class="lbl">月均支出</div><div class="val">${fmt(avgExp)}</div><div class="sub">今年 ${monthsWithData} 個月</div></div>
  `;

  // yearly bar
  const yearData = Array.from({length:12},(_,m)=>({ m, label:(m+1)+'月', val:getMonthExp(thisYear,m) }));
  const maxY = Math.max(...yearData.map(d=>d.val),1);
  const wrap = document.getElementById('yearBarChart');
  wrap.innerHTML = '';
  yearData.forEach(d => {
    const pct = Math.max(2, Math.round((d.val/maxY)*100));
    const isNow = d.m===thisMonth;
    const col = document.createElement('div');
    col.className = 'ybar-col';
    col.innerHTML = `
      <div class="ybar-val" style="color:${isNow?'#e06c6c':'#555'}">${d.val>0?(d.val>=10000?Math.round(d.val/1000)+'k':d.val):''}</div>
      <div class="ybar" style="height:${pct}%;background:${isNow?'#e06c6c':'#2e3236'};"></div>
      <div class="ybar-lbl" style="color:${isNow?'#e06c6c':'#555'}">${d.label}</div>
    `;
    wrap.appendChild(col);
  });

  // donut — use currently viewed month
  const viewD = getViewMonth();
  document.getElementById('donutTitle').textContent = (viewD.getMonth()+1)+'月支出分類';
  const expTxs = getTxForMonth(viewD.getFullYear(), viewD.getMonth()).filter(t=>t.type==='exp');
  const catMap = {};
  expTxs.forEach(t => { catMap[t.cat]=(catMap[t.cat]||0)+t.amount; });
  const entries = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((a,e)=>a+e[1],0);

  const svg = document.getElementById('donutSvg');
  svg.innerHTML = '';
  const legend = document.getElementById('donutLegend');
  legend.innerHTML = '';

  if (!total) {
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',55); c.setAttribute('cy',55); c.setAttribute('r',38);
    c.setAttribute('fill','none'); c.setAttribute('stroke','#2a2d30'); c.setAttribute('stroke-width','16');
    svg.appendChild(c);
    legend.innerHTML = '<div style="font-size:12px;color:#444;">本月無支出紀錄</div>';
    return;
  }

  const cx=55, cy=55, r=38;
  let angle = -Math.PI/2;
  entries.forEach((e,i) => {
    const color = DONUT_COLORS[i%DONUT_COLORS.length];
    const slice = (e[1]/total)*2*Math.PI;
    const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
    angle += slice;
    const x2=cx+r*Math.cos(angle), y2=cy+r*Math.sin(angle);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${slice>Math.PI?1:0} 1 ${x2} ${y2} Z`);
    path.setAttribute('fill', color);
    svg.appendChild(path);
    const pct = Math.round(e[1]/total*100);
    const li = document.createElement('div');
    li.className = 'leg-item';
    li.innerHTML = `<div class="leg-dot" style="background:${color}"></div><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e[0]}</span><div class="leg-bar-wrap"><div class="leg-bar" style="width:${pct}%;background:${color}"></div></div><span class="leg-pct">${pct}%</span>`;
    legend.appendChild(li);
  });

  const hole = document.createElementNS('http://www.w3.org/2000/svg','circle');
  hole.setAttribute('cx',cx); hole.setAttribute('cy',cy); hole.setAttribute('r',22);
  hole.setAttribute('fill','#1c1f22');
  svg.appendChild(hole);

  [['支出',cy-4,'10','#888'],[(total>=10000?(total/10000).toFixed(1)+'萬':total.toLocaleString()),cy+10,'11','#f0ede8']].forEach(([txt,y,fs,fill]) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg','text');
    el.setAttribute('x',cx); el.setAttribute('y',y);
    el.setAttribute('text-anchor','middle'); el.setAttribute('font-size',fs);
    el.setAttribute('fill',fill); el.textContent = txt;
    svg.appendChild(el);
  });
}

function openModal(id) {
  editingId = id;
  if (id===null) {
    document.getElementById('modalTitle').textContent='新增一筆';
    document.getElementById('submitBtn').textContent='記帳';
    document.getElementById('delBtn').style.display='none';
    document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
    document.getElementById('fAmount').value='';
    document.getElementById('fNote').value='';
    setType('exp');
  } else {
    const t = transactions.find(x=>x.id===id); if(!t) return;
    document.getElementById('modalTitle').textContent='編輯';
    document.getElementById('submitBtn').textContent='儲存';
    document.getElementById('delBtn').style.display='block';
    setType(t.type);
    document.getElementById('fAmount').value=t.amount;
    document.getElementById('fNote').value=t.note;
    document.getElementById('fDate').value=t.date;
    setTimeout(()=>{ document.getElementById('fCat').value=t.cat; },0);
  }
  document.getElementById('modalBg').style.display='flex';
  setTimeout(()=>document.getElementById('fAmount').focus(),300);
}

function closeModal() { document.getElementById('modalBg').style.display='none'; editingId=null; }

function setType(t) {
  currentType = t;
  document.getElementById('typeExp').className='type-btn'+(t==='exp'?' ae':'');
  document.getElementById('typeInc').className='type-btn'+(t==='inc'?' ai':'');
  document.getElementById('typeInv').className='type-btn'+(t==='inv'?' av':'');
  document.getElementById('fCat').innerHTML=CATS[t].map(c=>`<option value="${c}">${c}</option>`).join('');
}

function saveTx() {
  const amount=parseInt(document.getElementById('fAmount').value);
  if(!amount||amount<=0){document.getElementById('fAmount').focus();return;}
  const cat=document.getElementById('fCat').value;
  const note=document.getElementById('fNote').value||cat;
  const date=document.getElementById('fDate').value;
  if(editingId!==null){
    const idx=transactions.findIndex(x=>x.id===editingId);
    if(idx>-1) transactions[idx]={id:editingId,type:currentType,cat,note,amount,date};
    showToast('已更新');
  } else {
    transactions.push({id:nextId++,type:currentType,cat,note,amount,date});
    showToast('已記帳');
  }
  saveData(); closeModal();
  const txDate=new Date(date); const now=new Date();
  currentMonthOffset=(txDate.getFullYear()-now.getFullYear())*12+(txDate.getMonth()-now.getMonth());
  filterCat='all'; render();
  if(currentTab==='analysis') renderAnalysis();
}

function deleteTx() {
  if(editingId===null) return;
  transactions=transactions.filter(x=>x.id!==editingId);
  saveData(); showToast('已刪除'); closeModal(); render();
  if(currentTab==='analysis') renderAnalysis();
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
setType('exp');
render();
</script>
